services:
  - type: web
    name: gsoc-navigator-os
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MONITORING_INTERVAL_SECONDS
        value: 300
      - key: KEEP_ALIVE_URL
        value: https://gsoc-navigator-os.onrender.com
